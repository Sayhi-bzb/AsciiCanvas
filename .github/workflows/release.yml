name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'Sayhi-bzb/CharDesk'
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up current npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify unified release version
        run: node scripts/release/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Check package publication status
        id: package-status
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          if npm view "@chardesk/protocol@$version" version >/dev/null 2>&1; then
            echo "protocol_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "protocol_published=false" >> "$GITHUB_OUTPUT"
          fi
          if npm view "@chardesk/fonts@$version" version >/dev/null 2>&1; then
            echo "fonts_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "fonts_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify repository
        run: npm run verify

      - name: Test fonts package
        run: npm run test:fonts

      - name: Test protocol package
        run: npm run test:protocol

      - name: Pack release assets
        run: |
          mkdir release-assets
          npm pack --workspace @chardesk/protocol --pack-destination release-assets
          npm pack --workspace @chardesk/fonts --pack-destination release-assets

      - name: Smoke test packed packages
        run: >-
          node scripts/release/smoke-packed-packages.mjs
          release-assets/chardesk-protocol-${GITHUB_REF_NAME#v}.tgz
          release-assets/chardesk-fonts-${GITHUB_REF_NAME#v}.tgz

      - name: Publish protocol to npm
        if: steps.package-status.outputs.protocol_published != 'true'
        run: npm publish --workspace @chardesk/protocol --access public --provenance

      - name: Publish fonts to npm
        if: steps.package-status.outputs.fonts_published != 'true'
        run: npm publish --workspace @chardesk/fonts --access public --provenance

      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.tgz \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
